services:
  postgres:
    image: postgres:16-alpine
    container_name: chatspin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatspin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatspin_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-chatspin_db}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatspin} -d ${POSTGRES_DB:-chatspin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatspin-redis
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: chatspin-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-chatspin}:${POSTGRES_PASSWORD:-chatspin_dev_pass}@postgres:5432/${POSTGRES_DB:-chatspin_db}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-chatspin_dev_secret_at_least_32_characters_long_for_security}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-mock_google_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-mock_google_client_secret}
      ALLOWED_ORIGINS: http://localhost:3005
      TURN_ENABLED: "false"
      COTURN_HOST: localhost
      COTURN_SECRET: chatspin_coturn_dev_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: chatspin-web
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
