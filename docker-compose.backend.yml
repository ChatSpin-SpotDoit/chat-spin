services:
  postgres:
    image: postgres:16-alpine
    container_name: chatspin-postgres-backend
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatspin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chatspin_db}
    volumes:
      - postgres_backend_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatspin -d chatspin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatspin-redis-backend
    restart: always
    command: redis-server --maxmemory-policy noeviction
    volumes:
      - redis_backend_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${DOCKERHUB_USERNAME:-chatspin}/chatspin-server:latest
    container_name: chatspin-server-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TURN_ENABLED: ${TURN_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_backend_data:
  redis_backend_data:
