name: Deploy Backend via Docker Hub

on:
  push:
    branches:
      - prod
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'docker-compose.backend.yml'
      - 'nginx/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push Server Image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatspin-server:latest

      - name: Copy Compose files to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USERNAME }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT || 22 }}
          passphrase: ${{ secrets.ORACLE_VM_SSH_PASSPHRASE }}
          source: "docker-compose.backend.yml,nginx/**"
          target: "~/ChatSpin"

      - name: Execute Docker Compose Pull and Up on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USERNAME }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT || 22 }}
          passphrase: ${{ secrets.ORACLE_VM_SSH_PASSPHRASE }}
          script: |
            cd ~/ChatSpin
            
            # Automatically create the production .env file!
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER || 'chatspin' }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'your_secure_password' }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB || 'chatspin_db' }}" >> .env
            echo "DATABASE_URL=postgres://${{ secrets.POSTGRES_USER || 'chatspin' }}:${{ secrets.POSTGRES_PASSWORD || 'your_secure_password' }}@postgres:5432/${{ secrets.POSTGRES_DB || 'chatspin_db' }}" >> .env
            echo "REDIS_URL=redis://redis:6379" >> .env
            echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || '*' }}" >> .env
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET || 'fallback_secret_must_be_at_least_32_chars_long' }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'dummy_id' }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'dummy_secret' }}" >> .env
            
            # Pull the fresh image and restart the containers
            docker compose -f docker-compose.backend.yml pull server
            docker compose -f docker-compose.backend.yml up -d
