name: Deploy Backend to Oracle VM

on:
  push:
    branches:
      - prod
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USERNAME }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT || 22 }}
          passphrase: ${{ secrets.ORACLE_VM_SSH_PASSPHRASE }}
          script: |
            # Navigate to the repository folder
            cd ChatSpin
            
            # Pull the latest changes from the prod branch
            git pull origin prod
            
            # Rebuild and restart the backend containers
            docker compose -f docker-compose.backend.yml up -d --build
